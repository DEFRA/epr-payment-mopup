# Local disposable fixtures only. No published ports or external network access.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: LocalMopup_TestOnly42!
    networks: [fixtures]
    healthcheck:
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
    mem_limit: 2g
  storage:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    environment:
      AZURITE_ACCOUNTS: localmopup:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    networks: [fixtures]
  govpay:
    image: python:3.12-alpine
    command: python -u /fixtures/govpay.py
    volumes:
      - ./govpay.py:/fixtures/govpay.py:ro
    networks: [fixtures]
  function:
    image: epr-payment-mopup:net10-local-test
    platform: linux/amd64
    volumes:
      - ./settings.json:/home/site/wwwroot/local.settings.json:ro
    depends_on:
      sql:
        condition: service_healthy
      storage:
        condition: service_started
      govpay:
        condition: service_started
    environment:
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      FUNCTIONS_TIME_TRIGGER: '*/10 * * * * *'
      AzureWebJobsStorage: 'DefaultEndpointsProtocol=http;AccountName=localmopup;AccountKey=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==;BlobEndpoint=http://storage:10000/localmopup;QueueEndpoint=http://storage:10001/localmopup;TableEndpoint=http://storage:10002/localmopup;'
      SqlConnectionString: 'Server=sql;Database=MopupLocal;User ID=sa;Password=LocalMopup_TestOnly42!;Encrypt=true;TrustServerCertificate=true'
      TotalMinutesToUpdate: '270'
      IgnoringMinutesToUpdate: '180'
      Services__GovPayService__EndPointName: v1
      AzureFunctionsJobHost__logging__logLevel__default: Information
    networks: [fixtures]
networks:
  fixtures:
    internal: true
